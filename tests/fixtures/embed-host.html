<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cross-origin assistant host fixture</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:16px system-ui;background:#f4f4f5;color:#18181b}button,a,select{min-height:44px;padding:10px}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #2456bc;outline-offset:3px}#launcher{position:fixed;right:20px;bottom:max(20px,env(safe-area-inset-bottom))}#panel{position:fixed;right:16px;bottom:16px;width:min(440px,calc(100vw - 32px));height:min(720px,calc(100dvh - 32px));border:1px solid #555;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 12px 50px #0003;display:flex;flex-direction:column}#panel[hidden]{display:none}#panel.maximized{inset:16px;width:auto;height:auto}header{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:4px;border-bottom:1px solid #aaa}header h2{font-size:14px;flex:1;margin:8px}iframe{border:0;width:100%;flex:1;min-height:0}#status{margin:4px 10px;font-size:13px}#retry[hidden]{display:none}@media(max-width:600px){#panel,#panel.maximized{inset:0;width:100%;height:100dvh;border-radius:0}header{padding-top:max(4px,env(safe-area-inset-top))}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<main><h1>Portfolio integration fixture</h1><p>This test harness is not the production portfolio.</p><a href="#content">Host navigation</a><p id="content">The host remains usable outside this non-modal panel.</p>
<label>Host theme <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
<label>Host language <select id="locale"><option value="en">English</option><option value="es">Español</option></select></label>
<button type="button" id="remove">Remove host</button></main>
<button type="button" id="launcher" aria-expanded="false" aria-controls="panel">Open assistant</button>
<section id="panel" aria-labelledby="panel-title" hidden inert>
<header><h2 id="panel-title">Gonzalo’s AI assistant</h2><button type="button" id="minimize">Minimize</button><button type="button" id="maximize" aria-pressed="false">Maximize</button></header>
<p id="status" role="status">Connecting…</p><button type="button" id="retry" hidden>Retry connection</button>
</section>
<script type="module" src="/host.mjs"></script>
</html>
