# Local verification only. Private vps-ops owns production composition through Coolify.
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    networks: [private]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U assistant]
      interval: 3s
      retries: 30
  neo4j:
    image: neo4j:5.26.17-community@sha256:d31525aa50da9215d692e5e824696c63583636398f5f5b60260bb92f94095c70
    environment:
      NEO4J_AUTH: neo4j/change-me
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 256m
    networks: [private]
    volumes: [neo4j:/data]
    healthcheck:
      test: [CMD, cypher-shell, -u, neo4j, -p, change-me, RETURN 1]
      interval: 5s
      retries: 40
  api:
    image: assistant-web-api:contract-6b1e65f
    build: ../../.integration/api
    environment:
      DATABASE_URL: postgresql://assistant:assistant@postgres:5432/assistant
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: change-me
      ALLOWED_ORIGINS: http://localhost:3001,https://gonzalomartinperez.com
      AI_PROVIDER: fixture
      EMBEDDINGS_PROVIDER: fixture
      ALLOW_PAID_AI: 'false'
    networks: [private, edge]
    volumes: [../../.integration/corpus:/corpus:ro]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 25s
  web:
    environment:
      EMBED_ALLOWED_ORIGINS: http://localhost:3110
    image: portfolio-assistant-web:rc
    networks: [edge]
    read_only: true
    tmpfs: [/tmp, "/app/.next/cache:uid=1000,gid=1000,mode=0700,size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
  probe:
    image: portfolio-assistant-web:rc
    command: [node, /probe.mjs]
    networks: [edge]
    volumes: [./stream-probe.mjs:/probe.mjs:ro]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:4714e0b1b2577eaa1a6131d07c958b67f0eb68e6d0521e90c6e5287db8cf0bc5
    networks: [edge]
    ports: [127.0.0.1:3001:8080]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro, ./proxy-stream.conf:/etc/nginx/proxy-stream.conf:ro]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  private:
    internal: true
  edge:
volumes:
  postgres:
  neo4j:
