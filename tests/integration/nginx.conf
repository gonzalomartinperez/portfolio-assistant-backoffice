server {
  listen 8080;
  server_name localhost;
  client_max_body_size 16k;
  client_body_timeout 15s;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  location /api/ {
    # No URI suffix: preserve /api/v1 exactly. FastAPI root_path remains empty.
    proxy_pass http://api:8000;
    include /etc/nginx/proxy-stream.conf;
  }
  location /__stream_probe {
    proxy_pass http://probe:3000/stream;
    include /etc/nginx/proxy-stream.conf;
  }
  location /__stream_status {
    proxy_pass http://probe:3000/status;
  }
  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $http_host;
  }
}
