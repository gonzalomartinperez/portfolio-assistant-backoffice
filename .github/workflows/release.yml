name: Prepare immutable release
on:
  workflow_dispatch:
    inputs:
      publication_authorized:
        description: "Image publication and GHCR package visibility have been explicitly approved"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: backoffice-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/develop' && inputs.publication_authorized
    uses: ./.github/workflows/quality.yml
  publish:
    # Ordinary quality runs keep image bytes on their ephemeral runner. Re-enable only after
    # the private registry/artifact handoff is implemented and separately owner-approved.
    if: ${{ false }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: container-release
    permissions:
      contents: read
    steps:
      - name: Refuse an unconfigured artifact publication path
        run: |
          echo "Private artifact publication is not configured; no image was published."
          exit 1
