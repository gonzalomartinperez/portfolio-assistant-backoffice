name: Prepare immutable release
on:
  workflow_dispatch:
    inputs:
      publication_authorized:
        description: "Image publication and GHCR package visibility have been explicitly approved"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: backoffice-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/develop' && inputs.publication_authorized
    uses: ./.github/workflows/quality.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: container-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-image
          path: /tmp/image
      - run: gunzip -c /tmp/image/image.tar.gz | docker load
      - name: Publish verified image and record compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag portfolio-assistant-backoffice:rc "$image"
          docker push "$image"
          docker inspect "$image" --format '{{index .RepoDigests 0}}' > image-digest.txt
          node scripts/release-compatibility.ts image-digest.txt release.json "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-compatibility
          path: release.json
          retention-days: 90
