name: Quality
on:
  pull_request:
    branches: [develop, main]
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit all locked dependencies
        run: npm audit --audit-level=moderate
      - name: Check formatting, lint and strict types
        run: npm run format:check && npm run lint && npm run typecheck
      - name: Test state, transport, contract and architecture
        run: npm test
      - name: Scan public files and documentation links
        run: npm run security:check && npm run docs:check && npm run skills:check
      - name: Verify dependency protection access or mandatory disabled state
        run: node scripts/dependency-automation.ts
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_INSPECT: 'true'
          DEPENDABOT_AUTOMERGE: ${{ vars.DEPENDABOT_AUTOMERGE }}
          DEPENDABOT_POLICY_READY: ${{ vars.DEPENDABOT_POLICY_READY }}
      - name: Reject generated contract drift
        run: npm run contract:generate && git diff --exit-code contracts/types.d.ts
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: portfolio-assistant-web:rc
          cache-from: type=gha,scope=web-node24-amd64
          cache-to: type=gha,mode=max,scope=web-node24-amd64
      - name: Export the verified production image
        run: docker save portfolio-assistant-web:rc | gzip -1 > /tmp/image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-image
          path: /tmp/image.tar.gz
          retention-days: 7
          compression-level: 0
  browser:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-image
          path: /tmp/image
      - name: Load the exact production image
        run: gunzip -c /tmp/image/image.tar.gz | docker load
      - run: docker run -d --name assistant-browser -e EMBED_ALLOWED_ORIGINS=http://localhost:3110 --read-only --tmpfs /tmp --tmpfs /app/.next/cache:uid=1000,gid=1000,mode=0700,size=32m --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:3108:3000 portfolio-assistant-web:rc
      - name: Install all browser engines and OS dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify browser interactions and accessibility
        run: npm run test:browser
        env:
          WEB_UPSTREAM: http://127.0.0.1:3108
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Collect container logs
        if: always()
        run: docker logs assistant-browser
      - name: Remove only this job's container
        if: always()
        run: docker rm -f assistant-browser
  live-fixture:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-image
          path: /tmp/image
      - name: Load the exact production image
        run: gunzip -c /tmp/image/image.tar.gz | docker load
      - name: Install live-integration browser
        run: npx playwright install --with-deps chromium
      - name: Initialize isolated pinned backend and databases
        run: bash scripts/integration-up.sh
      - name: Verify actual API browser flows
        run: npx playwright test --config playwright.live.config.ts
      - name: Verify proxy security, streaming and graceful shutdown
        run: node scripts/proxy-smoke.ts
      - if: always()
        run: docker compose -p assistant-web-verification -f tests/integration/compose.yaml logs --no-color > /tmp/integration.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: live-fixture-failures
          path: |
            test-results/
            /tmp/integration.log
          retention-days: 14
      - if: always()
        run: docker compose -p assistant-web-verification -f tests/integration/compose.yaml down
  checks:
    if: always()
    needs: [static, image, browser, live-fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in jobs.values()), jobs
          PYCODE
