name: Quality
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck
      - run: npm test
      - run: npm run contract:generate && git diff --exit-code contracts/types.d.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gonzalomartinperez/portfolio-assistant-api
          ref: c83e383b6094dcb61168575063ef984f2896a0bf
          path: api
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gonzalomartinperez/portfolio
          ref: 1acbe54906c88398652aebb8eae0c217fd0d8821
          path: public-portfolio
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: docker compose -f api/compose.yaml up -d --wait
      - run: uv sync --python 3.13 --frozen && uv run python -m app.migrate && uv run python -m app.knowledge_sync --repo ../public-portfolio
        working-directory: api
      - run: (cd api && .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/assistant-api.log 2>&1 &)
      - run: npm run start > /tmp/assistant-web.log 2>&1 &
      - run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null && curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: npm run test:browser
      - run: docker build -t portfolio-assistant-web:ci .
