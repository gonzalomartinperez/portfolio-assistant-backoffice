name: Quality
on:
  pull_request:
    branches: [develop]
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check && npm run lint && npm run typecheck
      - run: npm test
      - run: npm run security:check && npm run docs:check
      - run: npm run contract:generate && git diff --exit-code contracts/types.d.ts
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: portfolio-assistant-web:rc
          cache-from: type=gha,scope=web-node24-amd64
          cache-to: type=gha,mode=max,scope=web-node24-amd64
      - run: docker save portfolio-assistant-web:rc | gzip -1 > /tmp/image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-image
          path: /tmp/image.tar.gz
          retention-days: 7
          compression-level: 0
  browser:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-image
          path: /tmp/image
      - run: gunzip -c /tmp/image/image.tar.gz | docker load
      - run: docker run -d --name assistant-browser --read-only --tmpfs /tmp --tmpfs /app/.next/cache:uid=1000,gid=1000,mode=0700,size=32m --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:3108:3000 portfolio-assistant-web:rc
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
        env:
          WEB_UPSTREAM: http://127.0.0.1:3108
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - if: always()
        run: docker logs assistant-browser && docker rm -f assistant-browser
  live-fixture:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-image
          path: /tmp/image
      - run: gunzip -c /tmp/image/image.tar.gz | docker load
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/integration-up.sh
      - run: npx playwright test --config playwright.live.config.ts
      - run: node scripts/proxy-smoke.mjs
      - if: always()
        run: docker compose -p assistant-web-verification -f tests/integration/compose.yaml logs --no-color > /tmp/integration.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: live-fixture-failures
          path: |
            test-results/
            /tmp/integration.log
          retention-days: 14
      - if: always()
        run: docker compose -p assistant-web-verification -f tests/integration/compose.yaml down
  checks:
    if: always()
    needs: [static, image, browser, live-fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in jobs.values()), jobs
          PYCODE
