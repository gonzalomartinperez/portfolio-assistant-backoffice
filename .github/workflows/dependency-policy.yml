name: Dependency policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for a read-only risk assessment
        required: true
        type: string
permissions: {}
concurrency:
  group: dependency-policy-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true
jobs:
  reconcile:
    if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Trusted default-branch data analysis only: never execute the PR or install it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.nvmrc
            /package.json
            /scripts/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Assess dependency risk without approval or merging
        run: node scripts/dependency-automation.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
