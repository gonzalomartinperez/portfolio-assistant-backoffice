<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="architecture-title architecture-description">
<title id="architecture-title">Private visibility, explicit access</title><desc id="architecture-description">Owners and invited viewers authenticate with Google or GitHub. Next.js verifies live membership against its PostgreSQL IAM store before private API reads. Validated operations, website counts and current feedback render into an aggregate dashboard with semantic tables. Tokens remain server-side. This is a system overview, not a deployed-service claim.</desc>
<style>
:root { --canvas:#f7f9fc; --group:#edf2f8; --card:#fff; --ink:#132238; --muted:#40526b; --line:#526780; --border:#6b829b; --accent:#036e87; }
@media (prefers-color-scheme:dark) { :root { --canvas:#0b1220; --group:#102035; --card:#111d2e; --ink:#edf3ff; --muted:#b0c0d6; --line:#94aec9; --border:#7188a2; --accent:#56d5f4; } }
text { font-family:Arial,Helvetica,sans-serif; fill:var(--ink); }
.canvas { fill:var(--canvas); }
.group { fill:var(--group); stroke:var(--border); stroke-dasharray:5 5; }
.card { fill:var(--card); stroke:var(--border); }
.label { font-family:monospace; font-size:13px; letter-spacing:1.4px; fill:var(--muted); }
.title { font-size:30px; font-weight:700; }
.heading { font-size:21px; font-weight:700; }
.body { font-size:16px; fill:var(--muted); }
.edge-label { font-size:14px; fill:var(--muted); }
.edge { fill:none; stroke:var(--line); stroke-width:2; stroke-linejoin:round; }
.response { stroke-dasharray:6 5; stroke:var(--accent); }
.arrow { fill:var(--line); }
.response-arrow { fill:var(--accent); }
.accent { fill:var(--accent); }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10Z"/></marker><marker id="response-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="response-arrow" d="M0 0L10 5L0 10Z"/></marker></defs>
<rect class="canvas" width="1120" height="650" rx="18"/>
<text x="40" y="40" class="label">GMP / PORTFOLIO BACKOFFICE</text><text x="40" y="83" class="title">Private visibility, explicit access</text><text x="40" y="115" class="body">Live membership. Bounded reads. No conversation export.</text><rect class="group" x="24" y="150" width="260" height="224" rx="16"/><text x="44" y="180" class="label">BROWSER + IDENTITY</text><rect class="group" x="334" y="150" width="420" height="440" rx="16"/><text x="354" y="180" class="label">PROTECTED SERVER + IAM</text><rect class="group" x="804" y="150" width="292" height="224" rx="16"/><text x="824" y="180" class="label">PRIVATE API CONTRACTS</text><rect class="group" x="24" y="406" width="260" height="184" rx="16"/><text x="44" y="436" class="label">AUTHENTICATED VIEW</text><g><rect class="card" x="48" y="210" width="212" height="120" rx="12"/><text x="66" y="242" class="heading">Invited access</text><text x="66" y="270" class="body">Google or GitHub</text><text x="66" y="294" class="body">No open signup</text></g><g><rect class="card" x="362" y="210" width="364" height="120" rx="12"/><text x="380" y="242" class="heading">Protected Next.js server</text><text x="380" y="270" class="body">Live membership before reads</text><text x="380" y="294" class="body">Runtime validation · no-store</text></g><g><rect class="card" x="832" y="210" width="236" height="120" rx="12"/><text x="850" y="242" class="heading">Private API reads</text><text x="850" y="270" class="body">Health · product · ratings</text><text x="850" y="294" class="body">Server-only service token</text></g><g><rect class="card" x="362" y="440" width="364" height="106" rx="12"/><text x="380" y="472" class="heading">PostgreSQL IAM</text><text x="380" y="500" class="body">Memberships · sessions · invitations</text><text x="380" y="524" class="body">Transactional owner rechecks</text></g><g><rect class="card" x="48" y="454" width="212" height="106" rx="12"/><text x="66" y="486" class="heading">Dashboard</text><text x="66" y="514" class="body">Charts + semantic tables</text><text x="66" y="538" class="body">EN / ES · light / dark</text></g><path class="edge" d="M260 246H362" marker-end="url(#arrow)"/><text x="282" y="235" class="edge-label">OAuth</text><path class="edge" d="M726 246H832" marker-end="url(#arrow)"/><text x="756" y="235" class="edge-label">read</text><path class="edge response" d="M832 294H726" marker-end="url(#response-arrow)"/><text x="752" y="320" class="edge-label">counts</text><path class="edge" d="M544 330V440" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="558" y="389" class="edge-label">verify access</text><path class="edge response" d="M362 316H310V506H260" marker-end="url(#response-arrow)"/><text x="824" y="434" class="label">DATA POLICY</text><text x="824" y="474" class="heading">Default-off views</text><text x="824" y="502" class="body">Product counts + current ratings</text><text x="824" y="526" class="body">Runtime flags · no automatic training</text><path class="edge" d="M40 621H73" marker-end="url(#arrow)"/><text x="86" y="626" class="edge-label">Request / sync</text><path class="edge response" d="M242 621H275" marker-end="url(#response-arrow)"/><text x="288" y="626" class="edge-label">Returned data</text><text x="484" y="626" class="edge-label">Dashed frames: trust boundaries · production selection belongs to vps-ops</text></svg>
